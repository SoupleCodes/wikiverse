<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN"
   "http://www.w3.org/TR/html4/frameset.dtd">
<HTML>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Wikiverse</title>
  <link rel="icon" type="image/gif" href="../images/icon.png">
  <link rel="stylesheet" type="text/css" href="../styles.css">
</head>

<body background="">
    <div>
      <div id="spacing" style="height: 50px"></div>
      <div id="sidebar-heading">
          <h1>
              wikiverse
          </h1>
      </div>
      <div id="sidebar">
          <h3 style="background-color: indianred;">explore</h3>
          <li><a href="/">home</a></li>
          <li><a href="/about/">about</a></li>
          <li><a href="/all/">all articles</a></li>
          <li><a href="/article/?id=89">featured article!</a></li>
          <li><a id="xss-toggle" href="javascript:void(0);" onclick="(function(){
            let allowXSS = localStorage.getItem('allowXSS') || '0';
            allowXSS = allowXSS === '1' ? '0' : '1';
            localStorage.setItem('allowXSS', allowXSS);
            if (allowXSS === '1')
                if (!confirm('Are you sure you want to enable XSS? This could be dangerous.'))
              localStorage.setItem('allowXSS', '0');
              allowXSS = localStorage.getItem('allowXSS') || '0';
              document.getElementById('xss-toggle').text = `toggle xss? ${allowXSS === '1' ? '(on)' : ''}`
          })();">toggle xss?</a></li>
          <script>
            (function() {
                let allowXSS = localStorage.getItem('allowXSS') || '0';
                const aElement = document.getElementById("xss-toggle")
                if (allowXSS === '1') {
                    console.log('XSS is allowed.');
                    aElement.text = 'toggle xss? (on)'
                } else {
                    console.log('XSS is not allowed.');
                    aElement.text = 'toggle xss?'
                }
            })();
        </script>

          <br>
          <h3 style="background-color: burlywood;">popular subjects</h3>
          <div id="popularSubjects"></div>
          <script>
            const response = fetch('https://wiki.souple.workers.dev/');
            response.then((response) => {
              if (response.ok) {
                return response.json();
              } else {
                throw new Error('Network response was not ok.');
              }
            }).then((data) => {
              const subjects = data.popularSubjects
              let popularSubjects = document.getElementById('popularSubjects');
              popularSubjects.innerHTML = ''
              subjects.forEach(subject => {
                popularSubjects.innerHTML += `<li><a href="/all/?subject=${subject}">${subject}</a></li>`});
              }
            ).catch((error) => {
              console.error('There was a problem with the fetch operation:', error);
            });
          </script>

          <br>
          <h3 style="background-color: cornflowerblue">account</h3>
          <li><a href="/login/">login</a></li>
          <li><a href="/register/">register</a></li>
          <li><a>logout</a></li>
      </div>
    </div>
    <div id="spacing" style="width: 17.7px"></div>
    <div>
    <div id="list">
      <div id="spacing" style="height: 66px"></div>
    </div>
    <ul id="pagination"></ul>
  </div>
    <script>
      const subject = new URLSearchParams(window.location.search).get("subject") || ''
      const pageNumber = Number(new URLSearchParams(window.location.search).get("page") || 1)

      async function fetchAllArticles() {
        try {
          const response = await fetch('https://wiki.souple.workers.dev/' + (subject ? `subject/${subject}` : 'all') + '/page/' + pageNumber);
          if (response.ok) {
            let json = await response.json();
            const articles = json.articles
            const pagesCount = json.totalPages
            const list = document.getElementById("list");
            
            if (list) {
              list.innerHTML += articles.map(article => article.title && article.author ? `
                <li>
                  <a href='/article/?id=${article.id}'>
                  ${new String(article.title)} by ${article.author} 
                  (${(() => {
                    try {
                      return JSON.parse(article.posts || "[]").length;
                    } catch (e) {
                      console.error("Error parsing posts for article:", article, e);
                      return 0;
                    }
                  })()} comments)
                  </a>
                </li>
              ` : '').join('');
            }
            if (pagesCount > 1) {
              const pagination = document.getElementById("pagination");
              if (pagination) {
                const maxButtons = 2;
                pagination.innerHTML = '';
                let start = Math.max(1, pageNumber - Math.floor(maxButtons / 2));
                let end = Math.min(pagesCount, start + maxButtons - 1);

                if (end - start < maxButtons - 1) {
                  start = Math.max(1, end - maxButtons + 1);
                }

                if (pageNumber > 1) {
                  pagination.innerHTML += `<li><a href="/all/?subject=${subject}&page=${pageNumber - 1}">&lt;</a></li>`;
                }
                for (let i = start; i <= end; i++) {
                  pagination.innerHTML += `<li ${i == pageNumber ? 'style="background-color: rgba(0, 0, 0, 0.2);"' : ''}><a href="/all/?subject=${subject}&page=${i}">${i}</a></li>`;
                }
                if (pageNumber < pagesCount) {
                  pagination.innerHTML += `<li><a href="/all/?subject=${subject}&page=${pageNumber + 1}">&gt;</a></li>`;
                  pagination.innerHTML += `<li style="background-color: rgba(0, 0, 0, 0.2);"><a href="/all/?subject=${subject}&page=${pagesCount}">&ge;</a></li>`;
                }
              }
            }
        } else {
          const error = await response.text();
          console.error("Error fetching articles:", error);
        }
      } catch (error) {
        console.error("Error fetching the articles", error);
      }
      }

      fetchAllArticles();
    </script>
    </body>
</HTML>
