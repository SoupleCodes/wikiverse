<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Home - Wikiverse</title>
  <link rel="icon" type="image/gif" href="/images/icon.png">
  <link rel="stylesheet" type="text/css" href="/main.css">
  <link rel="stylesheet" type="text/css" href="/all/all.css">
  <link rel="stylesheet" type="text/css" href="/font.css">
  <meta name="keywords" content="friends online social networking wiki articles">
</head>

<body background="/images/textures/cardboard-flat.png" bgcolor="#FBDAAD" topmargin="20">
  <div id="wrap">
    <div id="left" align="right">
    </div>
    <div id="main">
      <div id="navbar">
      </div>
      <div id="main-content">
        
        <div class="column grow" style="padding: 10px">

            <h4>All Articles</h4>
            <hr>            
            
            <div class="content-list">
                <ul></ul>
            </div>
            <div class="pagination row grow"></div>
            
        </div>
      </div>
    <img id="depth" src="/images/boxes/3d.png" style="width: 610px;height: 45px;">   
    </div>
    <div id="right" align="left">
    </div>
  </div>
    <script type="module" src="/populate.js"></script>
    <script src="../bundle.js"></script>
    <script>
        async function fetchAllArticles(subject, pageNumber) {
            try {
                const response = await fetch('https://wiki.souple.workers.dev/' + (subject ? `subject/${subject}` : 'all') + '/page/' + pageNumber)
                if (response.ok) {
                    const data = await response.json()
                    const articles = data.articles
                    const totalPages = data.totalPages

                    const list = document.querySelector('.content-list ul')
                    const pagination = document.querySelector('.pagination')
                    if(list) {
                        list.innerHTML = ''
                        articles.forEach(article => {
                            list.innerHTML +=`
                                <li>
                                    <a href="/article/?id=${article.id}">
                                        ${bbcodeparse(article.title)} by ${bbcodeparse(article.author)} [ views: ${article.view_count} | favorites: ${article.favorites} ]
                                    </a>
                                </li>
                            `
                        });
                    }
                    if(pagination) {
                        pagination.innerHTML = '<div style="flex-grow: .5"></div>'
                        for (let i = 1; i <= totalPages; i++) {
                            pagination.innerHTML += `<a href="/all/?page=${i}">${i}</a>`
                        }
                    }

                }
            } catch (error) {
                console.log('Error fetching page of articles ' + error)
            }
        }

        const subject = new URLSearchParams(window.location.search).get("subject") || ''
        const pageNumber = Number(new URLSearchParams(window.location.search).get("page") || 1)

        if(pageNumber) {
            fetchAllArticles(subject, pageNumber)
        }
        if(subject) {
            document.title = 'Articles about ' + subject
        } else {
            document.title = 'All articles from this website!'
        }
    </script>
</body>
</html>
