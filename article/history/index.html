<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<HTML>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Wikiverse</title>
    <link rel="icon" type="image/gif" href="/images/icon.png">
    <link rel="stylesheet" type="text/css" href="/styles.css">
</head>

<body background="">
    <div>
        <div id="spacing" style="height: 50px"></div>
        <div id="sidebar-heading">
            <h1>
                wikiverse
            </h1>
        </div>
        <div id="sidebar">
            <h3 style="background-color: indianred;">explore</h3>
            <li><a href="/">home</a></li>
            <li><a href="/about/">about</a></li>
            <li><a href="/all/">all articles</a></li>
            <li><a href="/article/?id=89">featured article!</a></li>
            <li><a id="xss-toggle" href="javascript:void(0);" onclick="(function(){
            let allowXSS = localStorage.getItem('allowXSS') || '0';
            allowXSS = allowXSS === '1' ? '0' : '1';
            localStorage.setItem('allowXSS', allowXSS);
            if (allowXSS === '1')
                if (!confirm('Are you sure you want to enable XSS? This could be dangerous.'))
              localStorage.setItem('allowXSS', '0');
              allowXSS = localStorage.getItem('allowXSS') || '0';
              document.getElementById('xss-toggle').text = `toggle xss? ${allowXSS === '1' ? '(on)' : ''}`
          })();">toggle xss?</a></li>
            <script>
                (function () {
                    let allowXSS = localStorage.getItem('allowXSS') || '0';
                    const aElement = document.getElementById("xss-toggle")
                    if (allowXSS === '1') {
                        console.log('XSS is allowed.');
                        aElement.text = 'toggle xss? (on)'
                    } else {
                        console.log('XSS is not allowed.');
                        aElement.text = 'toggle xss?'
                    }
                })();
            </script>

            <br>
            <h3 style="background-color: burlywood;">popular subjects</h3>
            <div id="popularSubjects"></div>
            <script>
              const response = fetch('https://wiki.souple.workers.dev/');
              response.then((response) => {
                if (response.ok) {
                  return response.json();
                } else {
                  throw new Error('Network response was not ok.');
                }
              }).then((data) => {
                const subjects = data.popularSubjects
                let popularSubjects = document.getElementById('popularSubjects');
                popularSubjects.innerHTML = ''
                subjects.forEach(subject => {
                  popularSubjects.innerHTML += `<li><a href="/all/?subject=${subject}">${subject}</a></li>`});
                }
              ).catch((error) => {
                console.error('There was a problem with the fetch operation:', error);
              });
            </script>
      
            <br>
            <h3 style="background-color: cornflowerblue">account</h3>
            <span id="user-name"></span>
            <script>
              const span = document.getElementById("user-name");
              if (localStorage.getItem("authToken")) {
                span.innerHTML = `<li><a href="/user?=${localStorage.getItem("username")}">you</a></li>`
              }
            </script>
            <li><a href="/login/">login</a></li>
            <li><a href="/register/">register</a></li>
            <li><a>logout</a></li>
        </div>
    </div>
    <div id="spacing" style="width: 17.7px"></div>
    <div id="article-history">

    </div>

    <script>
        async function fetchArticle(num) {
            const response = await fetch(`https://wiki.souple.workers.dev/article/${num}`);
            try {
                if (response.ok) {
                    const article = await response.json();
                    const articleTitle = article.title;
                    const articleHistory = JSON.parse(article.edit_history);
                    const articleAuthor = article.author
                    const articleCreationDate = article.creation_date
                    const articleLastModified = article.last_modified
                    const articleContent = article.content;

                    const articleElement = document.getElementById("article-history");

                    if (articleElement) {
                        document.title = `History of ${article.title} - Wikiverse`;
                        articleElement.innerHTML = `
                            <div class="article" id="article-${article.id}" data-article-id="${article.id}" data-edit-mode="false">
                                <div id="spacing" style="height: 66px"></div>
                                <div id="heading" class="article-heading" style="background-color: saddlebrown;color: burlywood;display: flex;">
                                    <h3 style="max-width: 200px;">${articleTitle}</h3>
                                    <div id="spacing" style="width: 20px;"></div>
                                    <div style="max-width: 100px;"><p>by ${articleAuthor}</p></div>
                                    <div class="back" style="margin-left: auto">
                                        <a href="/article/?id=${article.id}">
                                            <p>Back?</p>
                                        </a>
                                    </div>
                                </div>
                                <div id="contents">
                                    <h3>Current:</h3>
                                    <p id="article-content-${article.id}" style="margin-left: 30px;">${bbcodeparse(articleContent)}</p>
                                    ${articleHistory ? `
                                        ${articleHistory.map(pastArticle => `
                                            <h2>${formatDate(pastArticle.edit_date)}</h2>
                                            <p id="article-content-${article.id}" style="margin-left: 30px;">${bbcodeparse(pastArticle.new_content)}</p>
                                       `).join('')}
                                    ` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    const error = await response.text();
                    console.error("Error fetching article:", error);
                }
            } catch (error) {
                console.error("Error fetching the article", error);
            }
        }
        const articleId = new URLSearchParams(window.location.search).get("id")
    if (articleId) {
      fetchArticle(articleId);
    }
    </script>
      <script src="/formatBundle.js"></script>
      <script src="/bundle.js"></script>
</body>

</HTML>
