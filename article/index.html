<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN" "http://www.w3.org/TR/html4/frameset.dtd">
<HTML>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Wikiverse</title>
  <link rel="icon" type="image/gif" href="../icon.png">
  <link rel="stylesheet" type="text/css" href="../styles.css">
</head>

<body background="">
  <div>
    <div id="spacing" style="height: 50px"></div>
    <div id="sidebar-heading">
      <h1>
        wikiverse
      </h1>
    </div>
    <div id="sidebar">
      <h3 style="background-color: indianred;">explore</h3>
      <li><a href="/">home</a></li>
      <li><a href="/about/">about</a></li>
      <br>
      <h3 style="background-color: burlywood;">popular subjects</h3>
      <li><a>soup</a></li>
      <li><a>cats</a></li>
      <li><a>meower</a></li>
      <li><a>is mybearworld a bear?</a></li>
    </div>
  </div>
  <div id="spacing" style="width: 17.7px"></div>
  <div id="article-container"></div>

  <script type="module">
    import { formatDate } from '../formatDate.js';

    async function updateArticle(articleId, content, contentElement) {
      try {
        const response = await fetch(`https://wiki.souple.workers.dev/article/${articleId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            content: content
          })
        });

        if (response.ok) {
          console.log('Article updated successfully');
        } else {
          console.error('Failed to update article');
        }
      } catch (error) {
        console.error('Error updating article:', error);
      }
    }
    async function postComment(articleId, username, comment) {
      try {
        const response = await fetch(`https://wiki.souple.workers.dev/article/${articleId}/post`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            content: comment,
            user: username,
          })
        });

        if (response.ok) {
          console.log('Comment posted successfully');
          fetchArticle(articleId);
        } else {
          console.error('Failed to post comment');
        }
      } catch (error) {
        console.error('Error posting comment:', error);
      }
    }
    function handleCommentSubmit(articleId) {
      const usernameInput = document.getElementById(`username-input-${articleId}`);
      const commentInput = document.getElementById(`comment-input-${articleId}`);
    
      if (usernameInput && commentInput) {
        const username = usernameInput.value;
        const comment = commentInput.value;
    
        postComment(articleId, username, comment);
    
        commentInput.value = '';
      }
    }
    
    async function fetchArticle(num) {
      try {
        const response = await fetch(`https://wiki.souple.workers.dev/article/${num}`);
        if (response.ok) {
          const article = await response.json();
          const articleTitle = article.title;
          const articleAuthor = article.author;
          const articleContent = article.content;
          const articleSubject = article.subject;
          const articleComments = JSON.parse(article.posts);
          console.log(articleComments)
          const articleElement = document.getElementById("article-container");

          if (articleElement) {
            document.title = `${article.title} - Wikiverse`;
            articleElement.innerHTML = `
                            <div class="article" id="article-${article.id}" data-article-id="${article.id}" data-edit-mode="false">
                                <div id="spacing" style="height: 66px"></div>
                                <div id="heading" class="article-heading" style="background-color: saddlebrown;color: burlywood;display: flex;">
                                    <h3 style="max-width: 200px;">${articleTitle}</h3>
                                    <div id="spacing" style="width: 20px;"></div>
                                    <div><p>by ${articleAuthor}</p></div>
                                    <div class="edit" style="margin-left: auto;">
                                        <a href="#">
                                            <p>Edit?</p>
                                        </a>
                                    </div>
                                </div>
                                <div id="contents">
                                    <p id="article-content-${article.id}">${articleContent}</p>
                                    <hr>
                                    <div id="comments">
                                      <div style="display: flex; flex-direction: column;">
                                         <input type="text" id="username-input-${article.id}" placeholder="Your Username">
                                        <div style="display: flex;">
                                          <textarea 
                                            style="flex-grow: 1; height: 32px; resize: vertical;" 
                                            id="comment-input-${article.id}" 
                                            placeholder="Tell 'em what you think!" data-article-id="${article.id}"></textarea>
                                          <button id="comment-submit-${article.id}" type="button">Submit</button>
                                        </div>
                                      </div>
                                                                            <p>Comments:</p>

                                      ${articleComments ? `
                                      <div>
                                          ${articleComments.map(comment => `
                                            <p style="                               
                                                background-color: antiquewhite;
                                                padding: 4px;
                                                border-bottom: 1px solid saddlebrown;                                          
                                                margin: 0px;
                                            ">${comment.post} -${comment.user} <time>${formatDate(comment.creation_date)}</time></p>
                                          `).join('')}
                                      </div>
                                    ` : ''}
                                  </div>
                                </div>
                            </div>
                        `;
                        const edit = articleElement.querySelector("#heading a");
            if (edit) {
              edit.addEventListener("click", function (event) {
                event.preventDefault();
                  handleEditClick(article.id,this);
              });
            }

            const submitButton = document.getElementById(`comment-submit-${article.id}`);
            if (submitButton){
                submitButton.addEventListener('click', () => handleCommentSubmit(article.id));
            }
            
          }
        } else {
          const error = await response.text();
          console.error("Error fetching article:", error);
        }
      } catch (error) {
        console.error("Error fetching the article", error);
      }
    }
    function handleEditClick(articleId, editLink) {
      toggleEditMode(articleId);
    }
    function toggleEditMode(articleId) {
      const articleContainer = document.getElementById(`article-${articleId}`);
      const contentElement = document.getElementById(`article-content-${articleId}`);
      const contents = document.getElementById(`contents`);
      const editMode = articleContainer.getAttribute('data-edit-mode') === 'true';

      if (editMode) {
        const newContent = document.getElementById(`article-edit-input-${articleId}`).value;
        contents.removeChild(document.getElementById(`article-edit-form-${articleId}`));
        contentElement.textContent = newContent;
        articleContainer.setAttribute('data-edit-mode', 'false');
        updateArticle(articleId, newContent, contentElement);
        contentElement.style.display = 'block';
      } else {
        const currentContent = contentElement.textContent;
        articleContainer.setAttribute('data-edit-mode', 'true');

        const editForm = document.createElement('form');
        editForm.id = `article-edit-form-${articleId}`;

        const editInput = document.createElement('textarea');
        editInput.id = `article-edit-input-${articleId}`;
        editInput.classList.add('edit-input');
        editInput.value = currentContent;

        const submitButton = document.createElement('button');
        submitButton.type = 'button';
        submitButton.textContent = 'Update';
        submitButton.addEventListener('click', () => {
          toggleEditMode(articleId);
        });

        editForm.appendChild(editInput);
        editForm.appendChild(submitButton);
          
        contents.insertBefore(editForm,contentElement)
        contentElement.style.display = 'none';
      }
    }
    const articleId = new URLSearchParams(window.location.search).get("id")
    if (articleId) {
      fetchArticle(articleId);
    }
  </script>

</body>

</HTML>
