<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="en">
    <head>
        <link rel="stylesheet" href="/styles/main.css"/>
        <link rel="stylesheet" href="/styles/create.css"/>
        <link rel="icon" type="image/png" href="/favicon.png"/>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="keywords" content="friends online social networking wiki articles blog poll">
    </head>
    <nav id="topbar"></nav>
    <body>
        <div id="main">
            <label for="title">
                <small>Title:</small>
                <input type="text" id="title" name="title" placeholder="My favorite soup" required>
            </label>
            <div id="edit-content">
                <div for="toggle-preview" style="color: gray;font-size: 8px;margin-left:auto"><input type="checkbox" name="toggle-preview" style="height: 8px;">Enable preview?</div>
                <textarea id="content" name="content" style="margin: 0;" required></textarea>
                <div class="hidden" id="content" name="content" style="margin: 0;width: 100%;height: 317px;"><p></p></div>
                <div id="emoji-list">
                </div>
            </div>
            <div id="edit-tags">
                <label for="add-tags" style="width: 442px;">
                    <small>Tags:</small>
                    <div style="display: flex;">
                        <input type="text" id="add-tags" name="tags" placeholder="soup" style="display: flex;flex-grow: 1;">
                        <button id="add-tag">Add tag</button>
                    </div>
                </label>
                <div id="tags">
                </div>
            </div>
            <div id="edit-style">
                <label for="add-tags" style="width: 442px;">
                    <small>Style:</small>
                    <textarea id="content" name="content" style="margin: 0;" required></textarea>
                </label>
            </div>
            <div id="edit-music">
                <div style="color: gray;font-size: 8px;float:left"><input type="checkbox" name="toggle-music" style="height: 8px;">Add music?</div>
                <div id="music-editor" class="hidden">
                    <div id="tabs-music" class="tabs">
                      <div class="tab">Artist</div>
                      <div class="tab">Song name</div>
                      <div class="tab">Audio url</div>
                      <div class="tab">Cover url</div>
                      <div class="tab">Date</div>
                      <div class="tab">Album</div>
                      <div class="tab">Genre</div>
                    </div>
                    <div id="music-input">
                        <div id="tabs-music" class="tab-content">
                            <input type="text" name="artist">
                            <input type="text" name="song name">
                            <input type="text" name="audio url">
                            <input type="text" name="cover url">
                            <input type="text" name="date">
                            <input type="text" name="album">
                            <input type="text" name="genre">
                        </div>
                        <button>Submit</button>
                    </div>
                    <div id="music-preview">
                        <div class="song-group" songurl="" link="">
                            <img src="">
                            <div class="song-detail">
                                <p></p>
                                <small></small>
                            </div>
                            <small class="song-date"></small>
                            <small class="song-album"></small>
                            <small class="song-genre"></small>
                        </div>
                    </div>
                </div>
            </div>
            <div id="edit-parentpart">
                <div style="color: gray;font-size: 8px;float:left"><input type="checkbox" name="toggle-parent" style="height: 8px;">Part of a series of blogs?</div>
                <div id="inputs-for-parent-part" class="hidden" style="float:right">
                    <label for="parent-id">
                        <small>Parent blog id:</small>
                        <input type="text" id="parent-id" name="title" placeholder="12" required>
                    </label>
                    <label>
                        <small>Part:</small>
                        <input type="text" id="part-id" name="title" placeholder="6" required>
                    </label>
                </div>
            </div>
            <div id="edit-comments-toggle">
                <div for="toggle-comments" style="color: gray;font-size: 8px;float:left"><input type="checkbox" name="toggle-comments" style="height: 8px;">Enable comments?</div>
            </div>
            <div id="edit-globalcss-toggle">
                <div for="toggle-globalcss" style="color: gray;font-size: 8px;float:left"><input type="checkbox" name="toggle-globalcss" style="height: 8px;">Use global css?</div>
            </div>
            <button id="post-button" onclick="submitBlog()" type="submit">Submit</button>
        </div>
    </body>
    <script type="text/javascript" src="/js/helper.js"></script>
    <script type="text/javascript" src="/js/create.js"></script>
    <script type="text/javascript" src="/js/nav.js"></script>
</html>
