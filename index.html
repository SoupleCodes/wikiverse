<html lang="en">
    <head>
        <link rel="stylesheet" href="/styles/main.css"/>
        <link rel="stylesheet" href="/styles/index.css"/>
        <link rel="icon" type="image/png" href="/favicon.png"/>
        <title>home - wikiverse</title>
        <meta name="keywords" content="friends online social networking wiki articles blog poll">

    <nav id="topbar"></nav>
    <body>
        <div id="login">
            <form id="login-form" method="post" action="#">

                    <tr height="40">
                        <td width="201">

                        </td>
                        <td width="191">
                            <label for="password">password:</label>
                            <input type="password" name="password" required/>
                        </td>
                        <td valign="bottom">
                            <input type="submit" name="login" value="Login" class="button">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td width="191" style="padding: 0;font-size: 8pt;">
                            <input type="checkbox" style="width: 12px;height: auto;"><label>Remember me?</label>
                        </td>
                        <td></td> 
                        <td width="200" align="right">
                            <span style="font-size: 8pt;">Need to sign in? <a href="/join">Click here</a>
                            </span>
                        </td>
                    </tr>
                </table>
            </form>
            <img id="bg_login" src="/images/ui/bg_login.png"/>
        </div>
        <div id="main">
            <div id="left">
                <div id="featured-article" class="article-preview">
                    <h5 class="title">Featured article</h5>
                </div>
                <div id="random-article" class="article-preview">
                    <h5 class="title">Random article</h5>
                </div>
                <div id="popular-article" class="article-preview">
                    <h5 class="title">Popular article</h5>
                </div>
            </div>
            <div id="right">
                
            </div>
        </div>
