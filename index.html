<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="en">
    <head>
        <link rel="stylesheet" href="/styles/main.css"/>
        <link rel="stylesheet" href="/styles/index.css"/>
        <title>home - wikiverse</title>
        <meta name="keywords" content="friends online social networking wiki articles blog poll">
    </head>
    <nav id="topbar"></nav>
    <body>
        <div id="login">
            <form id="login-form" method="post" action="#">
                <table id="login-form">
                    <tr height="40">
                        <td width="201">
                            <label for="username">username:</label>
                            <input type="text" name="username" required/>
                        </td>
                        <td width="191">
                            <label for="password">password:</label>
                            <input type="password" name="password" required/>
                        </td>
                        <td valign="bottom">
                            <input type="submit" name="login" value="Login" class="button">
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td width="191" style="padding: 0;font-size: 8pt;">
                            <input type="checkbox" style="width: 12px;height: auto;"><label>Remember me?</label>
                        </td>
                        <td></td> 
                        <td width="200" align="right">
                            <span style="font-size: 8pt;">Need to sign in? <a href="/register">Click here</a>
                            </span>
                        </td>
                    </tr>
                </table>
                <script type="text/javascript">
                    const submit = document.querySelector('form#login-form input[type="submit"]')
                    const loginForm = document.querySelector('form#login-form')

                    submit.addEventListener('click', async (e) => {
                        e.preventDefault()

                        const formData = new FormData(loginForm)
                        const data = Object.fromEntries(formData.entries())

                        try {
                            const response = await fetch("https://wiki.souple.workers.dev/login", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify(data)
                            });
                            if(!response.ok) {
                                throw new Error(response.message)
                            }
                            
                            const responseData = await response.json()
                            localStorage.clear()
                            localStorage.setItem('token', responseData.token)
                            localStorage.setItem('user', JSON.stringify(responseData.user))

                            window.location.reload()
                        } catch (error) {
                            alert('Error: ' + error)
                        }
                    })
                </script>
            </form>
            <img id="bg_login" src="/images/ui/bg_login.png"/>
        </div>
        <div id="main">
            <div id="left">

            </div>
            <div id="right">
                
            </div>
        </div>
    </body>
    <script type="text/javascript" src="/js/dropdown.js"></script>
    <script type="text/javascript" src="/js/nav.js"></script>
</html>
