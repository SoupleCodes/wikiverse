<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Home - Wikiverse</title>
  <link rel="icon" type="image/gif" href="./images/icon.png">
  <link rel="stylesheet" type="text/css" href="./main.css">
  <link rel="stylesheet" type="text/css" href="./font.css">
  <link rel="stylesheet" type="text/css" href="./home.css">
  <meta name="keywords" content="friends online social networking wiki articles">
</head>

<body background="/images/textures/cardboard-flat.png" bgcolor="#FBDAAD" topmargin="20">
  <div id="wrap">
    <div id="left" align="right">
    </div>
    <div id="main">
      <div id="navbar">
      </div>
      <div id="main-content">
        <div style="box-shadow: 0px 0px 9px rgba(0, 0, 0, 0.621);height: 21px;width: 100%;margin-top: -21px;"></div>
        <div style="padding: 10px;display: flex;flex-direction: column;flex-grow: 1;">
          <div id="info">
            <h4>Hello, Guest!</h4>
            <time></time>
            <script>
              const timeElement = document.querySelector('#info time');
              const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: 'numeric',
                minute: 'numeric',
                hour12: true
              };
              const formattedDate = new Date().toLocaleString('en-US', options);
              timeElement.textContent = formattedDate
            </script>
          </div>
          <hr>
          <div id="home" class="row grow">
          <div id="row1">
            <div class="user-profile">
              <div style="position:absolute;left:-4px;top:-4px">
                <img src="./images/ribbons/yourprofile.png" />
              </div>
              <div style="height: 24px;"></div>
              <div id="user-profile-content">
              </div>
              <script>
                const userData = JSON.parse(localStorage.getItem(localStorage.getItem("loggedInAs")))
                if (userData) {
                  const user = userData.user
                  let userProfileElement = document.querySelector('#user-profile-content');
                  let followersCount = (user.followers || []).length
                  let followingCount = (user.following || []).length
                  userProfileElement.innerHTML =
                    `
                      <img src=${user.pfp_url || './images/default.png'} title="${user.username}" style="width:69px; -webkit-box-reflect: below 2px linear-gradient(transparent, rgba(0, 0, 0, 0.3));">
                      <div style="height: 8px;"></div>
                      <p><b>Last login:</b> ${new Date(user.last_login).toLocaleString('en-US', {
                      year: 'numeric',
                      month: 'long',
                      day: 'numeric',
                      hour12: true
                    })}</p>
                      <p><b>Last activity:</b> ${new Date(user.updated_at).toLocaleString('en-US', {
                      year: 'numeric',
                      month: 'long',
                      day: 'numeric',
                      hour12: true
                    })}</p>
                      <p><b>Posts:</b> ${(user.posts || []).length}</p>
                      <p><b>Followers:</b> ${followersCount}</p>
                      <p><b>Following:</b> ${followingCount}</p>
                      <div style="width: 100%;" class="row">
                        <small>
                          <a href="/user/?=${user.username}">view</a>
                        </small>
                        <small style="margin-left: auto;">
                          <a href="/you">edit</a>
                          </small>
                      </div>
                    `
                }
              </script>
            </div>
            <div class="create-article">
              <div style="position:absolute;left:-4px;top:-4px">
                <img src="./images/ribbons/createarticle.png" />
              </div>
              <div style="height: 24px;"></div>
              <form id="article-form">
                <input type="text" id="title" name="title" placeholder="What is le title" required>
                <input type="text" id="subject" name="subject" placeholder="What is le subject" required>

                <br>
                <textarea id="content" name="content" style="width: inherit;height: 101px;" required></textarea>

                <button type="submit">Submit</button>
              </form>
              <script>
                document.getElementById("article-form").addEventListener("submit", async function (event) {
                  event.preventDefault();

                  const formData = new FormData(this);
                  const data = Object.fromEntries(formData.entries());
                  const account = localStorage.getItem(localStorage.getItem("loggedInAs"))
                  const token = JSON.parse(account).token

                  try {
                    const response = await fetch("https://wiki.souple.workers.dev/submit", {
                      method: "POST",
                      headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${token}`
                      },
                      body: JSON.stringify(data)
                    });

                    if (response.ok) {
                      const re = await response.json();
                      alert("Article submitted successfully!");
                      this.reset();
                      window.location.href = `/article/?id=${re.id}`
                    } else {
                      const error = await response.text();
                      alert("Error submitting article: " + error);
                    }
                  } catch (error) {
                    alert("Error submitting article: " + error);
                  }
                });
              </script>
            </div>
          </div>
          <div style="margin-right: 19px"></div>
          <div id="row2" class="column grow">
            <div class="featured-article">
              <div style="position:absolute;left:-4px;top:-4px">
                <img src="./images/ribbons/featuredarticle.png" />
              </div>
              <div style="height: 10px;"></div>
            </div>
            <div class="random-article">
              <div style="position:absolute;left:-4px;top:-4px">
                <img src="./images/ribbons/randomarticle.png" />
              </div>
              <div style="height: 10px;"></div>
              <script>
                async function fetchRandomArticle() {
                  try {
                    const response = await fetch("https://wiki.souple.workers.dev/random");
                    if (response.ok) {
                      const article = await response.json();
                      const articleElement = document.querySelector(".random-article");
                      const options = {
                        month: 'long',
                        day: 'numeric',
                        year: 'numeric',
                        hour12: true
                      };
                      const formattedDate = new Date(article.creation_date).toLocaleString('en-US', options);
                      if (articleElement) {
                        articleElement.innerHTML +=
                          `
                            <div style="display: flex">
                              <h4 style="max-width: 200px; color: #547E5B">${article.title}</h4>
                              <div id="spacing" style="width: 9px;"></div>
                              <div style="max-width: 100px; color: #6A9E4B">
                                <i><small>by <a href="/user?=${article.author}" style="color: #6A9E4B">${article.author}</a></small></i>
                              </div>
                              <div class="date" style="margin-left: auto">
                                <time>${formattedDate}</time>
                              </div>
                            </div>
                            <p id="sampletext">${article.content}</p>
                            <div id="see-more" class="row-reverse">
                              <small><a href="/article/?id=${article.id}">see more</a></small>
                            </div>
              `
                      }
                    } else {
                      const error = await response.text();
                      console.error("Error fetching random article:", error);
                    }
                  } catch (error) {
                    console.error("Error fetching random article:", error);
                  }
                }
                window.addEventListener("load", fetchRandomArticle);
              </script>
            </div>
            <div class="popular-article">
              <div style="position:absolute;left:-4px;top:-4px">
                <img src="./images/ribbons/populararticle.png" />
              </div>
              <div style="height: 10px;"></div>
            </div>
          </div>
          </div>
        </div>
      </div>
      <img id="depth" src="./images/boxes/3d.png" style="width: 610px;height: 45px;">
    </div>
    <div id="right" align="left">
    </div>
  </div>
  <script src="populate.js"></script>
</body>

</html>
