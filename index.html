<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Frameset//EN"
   "http://www.w3.org/TR/html4/frameset.dtd">
<HTML>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Wikiverse</title>
    <link rel="icon"
          type="image/gif"
          href="./images/icon.png">
    <link rel="stylesheet"
          type="text/css"
          href="./styles.css">
    </head>
<body background="">
    <div>
      <div id="spacing" style="height: 50px"></div>
      <div id="sidebar-heading">
          <h1>
              wikiverse
          </h1>
      </div>
      <div id="sidebar">
          <h3 style="background-color: indianred;">explore</h3>
          <li><a href="/">home</a></li>
          <li><a href="/about/">about</a></li>
          <li><a href="/all/">all articles</a></li>
          <li><a href="/article/?id=89">featured article!</a></li>
          <li><a id="xss-toggle" href="javascript:void(0);" onclick="(function(){
            let allowXSS = localStorage.getItem('allowXSS') || '0';
            allowXSS = allowXSS === '1' ? '0' : '1';
            localStorage.setItem('allowXSS', allowXSS);
            if (allowXSS === '1')
                if (!confirm('Are you sure you want to enable XSS? This could be dangerous.'))
              localStorage.setItem('allowXSS', '0');
              allowXSS = localStorage.getItem('allowXSS') || '0';
              document.getElementById('xss-toggle').text = `toggle xss? ${allowXSS === '1' ? '(on)' : ''}`
          })();">toggle xss?</a></li>
          <script>
            (function() {
                let allowXSS = localStorage.getItem('allowXSS') || '0';
                const aElement = document.getElementById("xss-toggle")
                if (allowXSS === '1') {
                    console.log('XSS is allowed.');
                    aElement.text = 'toggle xss? (on)'
                } else {
                    console.log('XSS is not allowed.');
                    aElement.text = 'toggle xss?'
                }
            })();
        </script>
          <br>
          <h3 style="background-color: burlywood;">popular subjects</h3>
          <li><a>soup</a></li>
          <li><a>cats</a></li>
          <li><a>meower</a></li>
          <li><a>is mybearworld a bear?</a></li>
      </div>
    </div>
    <div id="spacing" style="width: 17.7px"></div>
    <div>
      <div id="spacing" style="height: 50px"></div>
      <div id="heading">
        <h3 style="background-color: olive; color: darkkhaki;">View this random article</h3>
        <div id="random-article">
        </div>
      </div>
      <div id="heading">
        <h3 style="background-color: saddlebrown; color: burlywood">...or search for one</h3>
        <form id="searchForm">
            <label for="search">Search:</label>
            <input type="text" id="search" name="search" required>
            <button type="submit">Go!</button>
        </form>
      </div>
      <div id="heading">
        <h2 style="background-color:cadetblue; color: aliceblue;">...or submit your own!</h2>
        <form id="articleForm">
            <label for="title">Title:</label><br>
            <input type="text" id="title" name="title" required><br><br>
          
            <label for="author">Author:</label><br>
            <input type="text" id="author" name="author" required><br><br>
          
            <label for="subject">Subject:</label><br>
            <input type="text" id="subject" name="subject" required><br><br>
        
            <label for="content">Content:</label><br>
            <textarea id="content" name="content" rows="5" cols="40" required></textarea><br><br>
        
            <button type="submit">Submit</button>
        </form>
      </div>
    </div>
        
        <script>
          document.getElementById("articleForm").addEventListener("submit", async function(event) {
            event.preventDefault();
        
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
        
            try {
              const response = await fetch("https://wiki.souple.workers.dev/submit", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
              });
        
              if (response.ok) {
                const re = await response.json();
                alert("Article submitted successfully!");
                this.reset();
                window.location.href = `/article/?id=${re.id}`
              } else {
                const error = await response.text();
                alert("Error submitting article: " + error);
              }
            } catch (error) {
              alert("Error submitting article: " + error);
            }
          });
        </script>
        
        <script>
          async function fetchRandomArticle() {
            try {
              const response = await fetch("https://wiki.souple.workers.dev/random");
              if (response.ok) {
                const article = await response.json();
                const articleElement = document.getElementById("random-article");
                if (articleElement) {
                  articleElement.innerHTML = `
                    <h3 style="display: inline;">${article.title}</h3>
                    <div id="spacing" style="width: 20px; display: inline-block;"></div>
                    <h6 style="display: inline; font-weight: 100;">by ${article.author}</h6>
                    <p>${(article.content).substring(0, 255)}${(article.content).length > 255 ? '...' : ''}</p>
                    <span style="float: right;">
                      <a href="/article/?id=${article.id}">
                        <p>Read more</p>
                      </a>
                    </span>
                    <br>
                  `;
                }
              } else {
                const error = await response.text();
                console.error("Error fetching random article:", error);
              }
            } catch (error) {
              console.error("Error fetching random article:", error);
            }
          }
          window.addEventListener("load", fetchRandomArticle);
        </script>

  </body>
</HTML>
