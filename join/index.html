<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="en">
    <head>
        <link rel="stylesheet" href="/styles/main.css"/>
        <link rel="stylesheet" href="/styles/index.css"/>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="keywords" content="friends online social networking wiki articles blog poll">
    </head>
    <nav id="topbar"></nav>
    <style>
        nav#topbar {
            background-color: #8AC46A;
        }
    </style>
    <body>
        <div id="register">
                <form id="register-form" onsubmit="register(); return false;">
                    <label for="username">Username:</label><br>
                    <input type="text" id="username" name="username" required><br><br>
            
                    <label for="password">Password:</label><br>
                    <input type="password" id="password" name="password" required><br><br>
            
                    <label for="content">Check password:</label><br>
                    <input type="text" id="retyped" name="retyped" required><br><br>
                    <br>
            
                    <button type="submit">Submit</button>
                </form>
                <script type="text/javascript">
                    async function register() {
                        const submit = document.querySelector('form#register-form input[type="submit"]')
                        const registerForm = document.querySelector('form#register-form')

                        const formData = new FormData(registerForm)
                        const data = Object.fromEntries(formData.entries())

                        try {
                            if (data.retyped != data.password) {
                                alert("Your passwords don't match. Please try again")
                                throw new Error("Your passwords don't match. Please try again")
                            }

                            const response = await fetch("https://wiki.souple.workers.dev/register", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    username: data.username,
                                    password: data.password
                                })
                            });
                            if(!response.ok) {
                                throw new Error(response.message)
                            }
                                
                            alert('Registered successfully!')
                            window.location.href = '/'

                        } catch (error) {
                            alert('Error: ' + error)
                        }
                    }
                </script>
        </div>
    </body>
    <script type="text/javascript" src="/js/helper.js"></script>
    <script type="text/javascript" src="/js/nav.js"></script>
</html>
