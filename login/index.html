<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="en">
    <head>
        <link rel="stylesheet" href="/styles/main.css"/>
        <link rel="stylesheet" href="/styles/create.css"/>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="keywords" content="friends online social networking wiki articles blog poll">
    </head>
    <nav id="topbar"></nav>
    <style>
        nav#topbar {
            background-color: #a86ac4;
        }
    </style>
    <body>
        <div id="main">
                <form id="login-form" onsubmit="login(); return false;">
                    <label for="username">
                        <small>Username:</small>
                        <input type="text" id="username" name="username" required>
                    </label>
                    <label for="password">
                        <small>Password:</small>
                        <input type="password" id="password" name="password" required>
                    </label>

                    <button type="submit">Submit</button>
                </form>
                <script type="text/javascript">
                    async function login() {
                        const submit = document.querySelector('form#login-form input[type="submit"]')
                        const loginForm = document.querySelector('form#login-form')

                        const formData = new FormData(loginForm)
                        const data = Object.fromEntries(formData.entries())

                        try {
                            const response = await fetch("https://wiki.souple.workers.dev/login", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    username: data.username,
                                    password: data.password
                                })
                            });
                            if(!response.ok) {
                                throw new Error(response.message)
                            }
                                
                            const responseData = await response.json()
                            localStorage.clear()
                            localStorage.setItem('token', responseData.token)
                            localStorage.setItem('user', JSON.stringify(responseData.user))
                            
                            window.location.href = '/'

                        } catch (error) {
                            alert('Error: ' + error)
                        }
                    }
                </script>
        </div>
    </body>
    <script type="text/javascript" src="/js/helper.js"></script>
    <script type="text/javascript" src="/js/nav.js"></script>
</html>
