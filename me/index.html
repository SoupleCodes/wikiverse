<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html lang="en">
    <head>
        <link rel="stylesheet" href="/styles/main.css"/>
        <link rel="stylesheet" href="/styles/create.css"/>
        <link rel="icon" type="image/png" href="/favicon.png"/>
        <title>my page - wikiverse</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="keywords" content="friends online social networking wiki articles blog poll">
    </head>
    <nav id="topbar"></nav>
    <body>
        <div id="main" style="display: flex;">
            <div id="left">
                <label for="display_name">
                    <small>Display name:</small>
                    <input type="text" id="title" name="display_name" placeholder="Wikiverse" oninput="updateDisplayName()">
                </label>
                <label for="pfp_url">
                    <small>Pfp url:</small>
                    <input type="text" id="title" name="pfp_url" placeholder="/favicon.png" oninput="updatePfp()">
                </label>
                <label for="banner_url">
                    <small>Banner url:</small>
                    <input type="text" id="title" name="banner_url" placeholder="https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png" oninput="updateBanner()">
                </label>
                <label for="location">
                    <small>Location:</small>
                    <input type="text" id="title" name="location" placeholder="215.36.255.238" oninput="updateLocation()">
                </label>
                <div id="edit-content">
                    <small style="float:left">About me:</small>
                    <textarea id="content" name="content" style="margin: 0;" oninput="updateAboutMe()"></textarea>
                    <div class="hidden" id="content" name="content" style="margin: 0;width: 100%;height: 317px;"><p></p></div>
                    <div id="emoji-list">
                    </div>
                </div>
                <div id="edit-style">
                    <label for="style" style="width: 442px;">
                        <small>Style:</small>
                        <textarea id="content" name="content" style="margin: 0;" oninput="updateStyle()"></textarea>
                    </label>
                </div>
                <div id="edit-default-blog-style">
                    <label for="default-blog-style" style="width: 442px;">
                        <small>Default blog style:</small>
                        <textarea id="content" name="content" style="margin: 0;" oninput="updateStyle()"></textarea>
                    </label>
                </div>
                <div id="edit-social-links">
                    <fieldset>
                        <legend><small>Social links:</small></legend>
                        <div id="social-links-inputarea">
                            <label>
                                <small>Username</small><input type="text" id="title" name="banner_url" required="" placeholder="John Doe">
                            </label>
                            <label>
                                <small>Website name</small><input type="text" id="title" name="banner_url" required="" placeholder="Wikiverse"></label>
                            <label>
                                <small>Url</small><input type="text" id="title" name="banner_url" required="" placeholder="https://wikiverse.pages.dev">
                            </label>
                            <button id='add-link'>+</button>
                        </div>
                        <div id="social-links">
                        </div>
                    </fieldset>
                </div>
                <div id="edit-music">
                    <fieldset>
                        <legend><small>Music:</small></legend>
                        <div id="tabs-music" class="tabs">
                          <div class="tab">Artist</div>
                          <div class="tab">Song name</div>
                          <div class="tab">Audio url</div>
                          <div class="tab">Cover url</div>
                          <div class="tab">Date</div>
                          <div class="tab">Album</div>
                          <div class="tab">Genre</div>
                        </div>
                        <div id="music-input">
                            <div id="tabs-music" class="tab-content">
                                <input type="text" name="artist">
                                <input type="text" name="song name">
                                <input type="text" name="audio url">
                                <input type="text" name="cover url">
                                <input type="text" name="date">
                                <input type="text" name="album">
                                <input type="text" name="genre">
                            </div>
                            <button>Submit</button>
                        </div>
                        <div id="music-details"></div>
                    </fieldset>
                </div>
                <button id="post-button" onclick="updateProfile()" type="submit">Submit</button>
            </div>
            <div id="right">
                <div id="preview">
                    <div id="preview-window">
                        <iframe width="750" height="1000" srcdoc="" frameborder="0" scrolling="auto"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script type="text/javascript" src="/js/helper.js"></script>
    <script type="text/javascript" src="/js/me.js"></script>
    <script type="text/javascript" src="/js/nav.js"></script>
</html>
