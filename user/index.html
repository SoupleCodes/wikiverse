<!DOCTYPE HTML>
<HTML>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User - Wikiverse</title>
  <link rel="icon" type="image/gif" href="../images/icon.png">
  <link rel="stylesheet" type="text/css" href="../styles.css">
</head>

<body background="">
  <div>
    <div id="spacing" style="height: 50px"></div>
    <div id="sidebar-heading">
      <h1>
        wikiverse
      </h1>
    </div>
    <div id="sidebar">
      <h3 style="background-color: indianred;">explore</h3>
      <li><a href="/">home</a></li>
      <li><a href="/about/">about</a></li>
      <li><a href="/all/">all articles</a></li>
      <li><a href="/article/?id=89">featured article!</a></li>
      <li><a id="xss-toggle" href="javascript:void(0);" onclick="(function(){
            let allowXSS = localStorage.getItem('allowXSS') || '0';
            allowXSS = allowXSS === '1' ? '0' : '1';
            localStorage.setItem('allowXSS', allowXSS);
            if (allowXSS === '1')
                if (!confirm('Are you sure you want to enable XSS? This could be dangerous.'))
              localStorage.setItem('allowXSS', '0');
              allowXSS = localStorage.getItem('allowXSS') || '0';
              document.getElementById('xss-toggle').text = `toggle xss? ${allowXSS === '1' ? '(on)' : ''}`
          })();">toggle xss?</a></li>
      <script>
        (function () {
          let allowXSS = localStorage.getItem('allowXSS') || '0';
          const aElement = document.getElementById("xss-toggle")
          if (allowXSS === '1') {
            console.log('XSS is allowed.');
            aElement.text = 'toggle xss? (on)'
          } else {
            console.log('XSS is not allowed.');
            aElement.text = 'toggle xss?'
          }
        })();
      </script>

      <br>
      <h3 style="background-color: burlywood;">popular subjects</h3>
      <div id="popularSubjects"></div>
      <script>
        const response = fetch('https://wiki.souple.workers.dev/');
        response.then((response) => {
          if (response.ok) {
            return response.json();
          } else {
            throw new Error('Network response was not ok.');
          }
        }).then((data) => {
          const subjects = data.popularSubjects
          let popularSubjects = document.getElementById('popularSubjects');
          popularSubjects.innerHTML = ''
          subjects.forEach(subject => {
            popularSubjects.innerHTML += `<li><a href="/all/?subject=${subject}">${subject}</a></li>`});
          }
        ).catch((error) => {
          console.error('There was a problem with the fetch operation:', error);
        });
      </script>

      <br>
      <h3 style="background-color: cornflowerblue">account</h3>
      <span id="user-name"></span>
      <script>
        const span = document.getElementById("user-name");
        if (localStorage.getItem("authToken")) {
          span.innerHTML = `<li><a href="/user?=${localStorage.getItem("username")}">you</a></li>`
        }
      </script>
      <li><a href="/login/">login</a></li>
      <li><a href="/register/">register</a></li>
      <li><a>logout</a></li>
    </div>
  </div>
  <div id="spacing" style="width: 17.7px"></div>
  <div id="user-container"></div>

  <script>
    const token = localStorage.getItem("authToken")
    const user = new URLSearchParams(window.location.search).get("")

    if (user) {
      document.title = `${user} - Wikiverse`
      fetchProfile(user).then(
        (data) => {
          console.log(data)
          document.getElementById("user-container").innerHTML = 
          `
            <div id="spacing" style="height: 50px"></div>
            <div id="contents" style="height: 500px; display: flex">
              <div class="flex-row" style="gap: 5px;">
                <div class="flex-column" id="user-profile" style="background-color: white; flex: 3 0 0;">
                </div>
                <div class="flex-column" id="user-commentd" style="background-color: white;">
                </div>
              </div>
            </div>
          `
        }).catch((error) => {
          console.error('There was a problem with the fetch operation:', error);
        });
    }

    async function updateProfile(profileData) {
      const response = await fetch(`https://wiki.souple.workers.dev/user/profile`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        },
        body: JSON.stringify(profileData)
      });
      try {
        if (response.ok) {
          alert('Profile updated successfully');
          } else {
            const error = await response.text();
            console.error("Error updating user:", error);
          }
        } catch (error) {
          console.error("Error updating the user", error);
        }
    }
  
    async function fetchProfile(user) {
      const response = await fetch(`https://wiki.souple.workers.dev/user/${user}`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${token}`
        }
      });
      try {
        if (response.ok) {
          const data = await response.json();
          return data;
        } else {
          const error = await response.text();
          console.error("Error fetching user:", error);
        }
      } catch (error) {
        console.error("Error fetching the user", error);
      }
    }


  </script>
  <script src="../formatBundle.js"></script>
  <script src="../bundle.js"></script>

</body>

</HTML>
