<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Edit your profile!</title>
  <link rel="icon" type="image/gif" href="/images/icon.png">
  <link rel="stylesheet" type="text/css" href="/main.css">
  <link rel="stylesheet" type="text/css" href="/you/you.css">
  <link rel="stylesheet" type="text/css" href="/font.css">
  <meta name="keywords" content="friends online social networking wiki articles">
</head>

<body background="/images/textures/cardboard-flat.png" bgcolor="#FBDAAD">
  <div id="wrap">
    <div id="left" align="right">
    </div>
    <div id="main">
      <div id="navbar">
      </div>
      <div id="main-content">
        
        <div class="column grow" style="padding: 10px">

            <h4>Your Profile</h4>
            <hr>            
            <div style="width: 100%; display: flex; justify-content: space-between; margin-bottom: 10px;">
              <button id="save-all" class="orange-button">Save All Changes</button>
              <button id="preview-profile" class="orange-button">Preview Profile</button>
            </div>
            <form id="profile">
                <div id="edit-pfpurl">
                    <label for="pfp-url">PFP url:  </label>
                    <div id="hold"><div contentEditable="plaintext-only"></div></div>
                </div>
                <div id="edit-displayname">
                    <label for="displayname">Display Name:  </label>
                    <div id="hold"><div contentEditable="plaintext-only"></div></div>
                </div>   
                <div id="edit-aboutme">
                    <label for="about_me">About Me:  </label>
                    <div id="hold" style="min-height: 60px;"><div contentEditable="plaintext-only"></div></div>
                </div>
                <div id="edit-signature">
                    <label for="signature">Signature: <small>(will show below all your posts)</small></label>
                    <div id="hold" style="min-height: 90px;"><div contentEditable="plaintext-only"></div></div>
                </div>
                <div id="edit-location">
                    <label for="location">Location:  </label>
                    <div id="hold"><div contentEditable="plaintext-only"></div></div>
                </div>
                <div id="edit-socialinks">
                    <label for="social-links">Social Links:  </label>
                    <div id="social-links">
                        <div class="column grow">
                            <div class="bookmarks row grow">
                                <div class="bookmark grow selected int" id="icon-url" data-target="icon-url">Icon url</div>
                                <div class="bookmark grow int" id="user-url" data-target="user-url">User url</div>
                                <div class="bookmark grow int" id="username" data-target="username">Username</div>
                            </div>
                        <div id="hold" style="z-index: 0;border-top: none;box-shadow: none;border-bottom: none;margin: 0;" class="column">
                            <div contentEditable="plaintext-only" class="" id="icon-url"></div>
                            <div contentEditable="plaintext-only" class="nodisplay" id="user-url"></div>
                            <div contentEditable="plaintext-only" class="nodisplay" id="username"></div>
                        </div>           
                    <div class="row" style="background: white;border: 1px solid #806d5e;border-top: none;border-bottom: none;padding: 4px;box-shadow: 0 1px 4px rgba(0, 0, 0, 0.09) inset, 0 2px 0 rgba(255, 255, 255, 0.3), inset 0px 8px 6px -6px rgba(106, 106, 106, 0.27);">
                            <div class="grow" id="result">
                                <div class="row">
                                    <img src="/images/default.png" style="height: 21px;">
                                    <a href="#" style="padding-left: 12px;">@myusername</a>
                                </div>
                            </div>
                            <div id="submit-social">
                                <button>submit</button>
                            </div>
                    </div>
                    <div id="prev-made" style="background: white;border: 1px solid #806d5e;border-top: none;padding: 4px">
                    </div>
                    </div>
                  </div>
                </div>
                <div id="edit-music">
                    <label for="music">Music: </label>
                    <div id="music">
                        <div class="column grow">
                            <div class="bookmarks row grow">
                                <div class="bookmark grow selected int" id="song-name-tab" data-target="song-name-input">Song Name</div>
                                <div class="bookmark grow int" id="artist-name-tab" data-target="artist-name-input">Artist Name</div>
                                <div class="bookmark grow int" id="song-url-tab" data-target="song-url-input">Song URL</div>
                                <div class="bookmark grow int" id="cover-art-tab" data-target="cover-art-input">Cover Art URL</div>
                                <div class="bookmark grow int" id="published-tab" data-target="published-input">Published Year</div>
                                <div class="bookmark grow int" id="album-tab" data-target="album-input">Album</div>
                                <div class="bookmark grow int" id="genre-tab" data-target="genre-input">Genre</div>
                                <div class="bookmark grow int" id="link-tab" data-target="link-input">Link</div>
                            </div>
                            <div id="hold" class="column" style="z-index: 0; border-top: none; box-shadow: none; border-bottom: none; margin: 0;">
                                <div id="song-name-input" contenteditable="plaintext-only" class=""></div>
                                <div id="artist-name-input" contenteditable="plaintext-only" class="nodisplay"></div>
                                <div id="song-url-input" contenteditable="plaintext-only" class="nodisplay"></div>
                                <div id="cover-art-input" contenteditable="plaintext-only" class="nodisplay"></div>
                                <div id="published-input" contenteditable="plaintext-only" class="nodisplay"></div>
                                <div id="album-input" contenteditable="plaintext-only" class="nodisplay"></div>
                                <div id="genre-input" contenteditable="plaintext-only" class="nodisplay"></div>
                                <div id="link-input" contenteditable="plaintext-only" class="nodisplay"></div>
                            </div>
                            <div class="row" style="background: white; border: 1px solid #806d5e; border-top: none; border-bottom: none; padding: 4px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.09) inset, 0 2px 0 rgba(255, 255, 255, 0.3), inset 0px 8px 6px -6px rgba(106, 106, 106, 0.27);">
                                <div class="grow" id="result">
                                </div>
                                <div id="submit-music">
                                    <button>Add Song</button>
                                </div>
                            </div>
                            <div class="row grow" style="background: white; border: 1px solid #806d5e; border-top: none; padding: 4px">
                                <div id="prev-made" style="width: 224px;">
                                </div>
                                <div class="row grow">
                                    <div style="width: 200px; padding: 10px">
                                        <div id="music-details">
                                            <div>
                                                <label for="song-name-detail">Song name:</label>
                                                <div id="song-name-detail" contenteditable="plaintext-only"></div>
                                            </div>
                                            <div>
                                                <label for="album-detail">Album:</label>
                                                <div id="album-detail" contenteditable="plaintext-only"></div>
                                            </div>
                                            <div>
                                                <label for="artist-detail">Artist:</label>
                                                <div id="artist-detail" contenteditable="plaintext-only"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="music-cover-art" class="grow" style="padding: 9px">
                                        <img src="https://legoshi.pages.dev/music/noart.png" style="width: 166px;box-shadow: 0 0 6px 0px #0000007a;"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="edit-style">
                    <label for="style">Style:  </label>
                    <div type="text" id="hold" style="min-height: 120px;"><div contentEditable="plaintext-only"></div></div>
                </div>
            </form>
            
        </div>
        <script>
            const user = JSON.parse(localStorage.getItem(localStorage.getItem("loggedInAs")))
            const userData = user.user
            const token = user.token;
            async function updateProfile(profileData) {
                const response = await fetch(`https://wiki.souple.workers.dev/user/profile`, {
                    method: 'PUT',
                    headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`
                    },
                    body: JSON.stringify(profileData)
                });
                try {
                    if (response.ok) {
                        const data = await response.json();
                        updateStorage('user', data, true);
                        alert('Profile updated successfully');
                    } else {
                        const error = await response.text();
                        console.error("Error updating user:", error);
                    }
                } catch (error) {
                    console.error("Error updating the user", error);
                }
            }

            const socialLinks = userData.social_links
            const music = userData.music
            
            const prevMade = document.querySelector('#social-links #prev-made')
            const prevMadeMusic = document.querySelector('#music #prev-made')
            const songNameDetail = document.querySelector('#music-details #song-name-detail')
            const albumDetail = document.querySelector('#music-details #album-detail')
            const artistDetail = document.querySelector('#music-details #artist-detail')
            const musicCoverArt = document.querySelector('#music-cover-art img')
            
            let musicElementSelected
            
            prevMade.innerHTML = ''
            prevMadeMusic.innerHTML = ''

            prevMade.innerHTML = ''
            prevMadeMusic.innerHTML = ''
            
            function setupBookmarks(containerId, inputContainerId) {
                const bookmarks = document.querySelectorAll(`${containerId} .bookmark`);
                const inputFields = document.querySelectorAll(`${inputContainerId} div[contenteditable]`);

                bookmarks.forEach(bookmark => {
                    bookmark.addEventListener('click', function() {
                        bookmarks.forEach(b => b.classList.remove('selected'));
                        inputFields.forEach(input => input.classList.add('nodisplay'));
                        this.classList.add('selected');

                        const targetInputId = this.dataset.target;
                        if (targetInputId) {
                            inputFields.forEach(input => {
                                if (input.id === targetInputId) {
                                    input.classList.remove('nodisplay');
                                }
                            });
                        }
                    });
                });
                }


                setupBookmarks('#social-links', '#social-links #hold');
                setupBookmarks('#music', '#music #hold');

            socialLinks && socialLinks.forEach(link => {
                prevMade.innerHTML +=
                `
                    <div class="row grow" id="social">
                        <a href="#" id="move-up"><img src="/images/ui/up.png"></a>
                        <a href="#" id="move-down"><img src="/images/ui/down.png"></a>
                        <div class="row grow">
                            <img src="${link.icon_link || '/images/default.png'}" style="height: 21px;">
                            <a href="${link.url || '#'}" style="padding-left: 12px;">@${link.username || 'unnamed'}</a>
                        </div>
                        <a href="#" id="trash"><img src="/images/ui/trash.png"></a>
                    </div>
                `
            })
            music && music.forEach(song => {
                prevMadeMusic.innerHTML +=
                `
                    <div class="row grow" id="music">
                        <a href="#" id="move-up"><img src="/images/ui/up.png"></a>
                        <a href="#" id="move-down"><img src="/images/ui/down.png"></a>
                        <div class="row grow">
                            <img src="${song.cover_art || '/images/default.png'}" style="height: 21px;">
                            <a id="content" href="${song.song_url || '#'}" style="padding-left: 12px;">${song.song_name || 'unnamed'}</a>
                            <div id="extra-info" data-songName="${song.song_name}" data-artistName="${song.artist_name}" data-songUrl="${song.song_url}" data-coverArt="${song.cover_art}" data-published="${song.published}" data-album="${song.album}" data-genre="${song.genre}" data-link="${song.link}">
                            </div>
                        </div>
                        <a href="#" id="trash"><img src="/images/ui/trash.png"></a>
                    </div>  `
            })
            Array.from(prevMadeMusic.children).forEach(prev => {
                prev.addEventListener('click', function(e) {
                    e.preventDefault()
                    musicElementSelected = this;
                    prevMadeMusic.querySelectorAll('div#music').forEach(prev => {
                        prev.style.background = 'white'
                    })
                    this.style.background = 'antiquewhite'
                    
                    songNameDetail.textContent = this.querySelector('#extra-info').dataset.songname
                    albumDetail.textContent = this.querySelector('#extra-info').dataset.album
                    artistDetail.textContent = this.querySelector('#extra-info').dataset.artistname
                    musicCoverArt.src = this.querySelector('#extra-info').dataset.coverart

                })
            })

            const iconUrl = document.querySelector('#hold #icon-url')
            const userUrl = document.querySelector('#hold #user-url')
            const username = document.querySelector('#hold #username')
            const songName = document.querySelector('#hold #song-name-input')
            const artistName = document.querySelector('#hold #artist-name-input')
            const songUrl = document.querySelector('#hold #song-url-input')
            const coverArt = document.querySelector('#hold #cover-art-input')
            const published = document.querySelector('#hold #published-input')
            const album = document.querySelector('#hold #album-input')
            const genre = document.querySelector('#hold #genre-input')
            const link = document.querySelector('#hold #link-input')

            document.getElementById('submit-social').addEventListener('click', async (event) => {
                event.preventDefault();
                prevMade.innerHTML +=
                `
                    <div class="row grow" id="social">
                        <a href="#" id="move-up"><img src="/images/ui/up.png"></a>
                        <a href="#" id="move-down"><img src="/images/ui/down.png"></a>
                        <div class="row grow">
                            <img src="${iconUrl.textContent || '/images/default.png'}" style="height: 21px;">
                            <a href="${userUrl.textContent || '#'}" style="padding-left: 12px;">@${username.textContent || 'unnamed'}</a>
                        </div>
                        <a href="#" id="trash"><img src="/images/ui/trash.png"></a>
                    </div>
                `        
            })
            document.getElementById('submit-music').addEventListener('click', async (event) => {
                event.preventDefault();
                const htmlString = `
                    <div class="row grow" id="music">
                    <a href="#" id="move-up"><img src="/images/ui/up.png"></a>
                    <a href="#" id="move-down"><img src="/images/ui/down.png"></a>
                    <div class="row grow">
                    <img src="${coverArt.textContent || '/images/default.png'}" style="height: 21px;">
                    <a href="${songUrl.textContent || '#'}" style="padding-left: 12px;">${songName.textContent || 'unnamed'}</a>
                    <div id="extra-info" data-songName="${songName.textContent}" data-artistName="${artistName.textContent}" data-songUrl="${songUrl.textContent}" data-coverArt="${coverArt.textContent}" data-published="${published.textContent}" data-album="${album.textContent}" data-genre="${genre.textContent}" data-link="${link.textContent}">
                                                </div>
                                            </div>
                    <a href="#" id="trash"><img src="/images/ui/trash.png"></a>
                                        </div>
                    `;
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = htmlString;
                const newMusicElement = tempDiv.firstElementChild;
                prevMadeMusic.appendChild(newMusicElement);
                let length = prevMadeMusic.children.length
                prevMadeMusic.children[length - 1].addEventListener('click', function(e) {
                    e.preventDefault()
                    musicElementSelected = this;
                    prevMadeMusic.querySelectorAll('div#music').forEach(prev => {
                        prev.style.background = 'white'
                    })
                    this.style.background = 'antiquewhite'
                    songNameDetail.textContent = songName.textContent
                    albumDetail.textContent = album.textContent
                    artistDetail.textContent = artistName.textContent
                    musicCoverArt.src = coverArt.textContent

                })
            })

            document.querySelector('#social-links #prev-made').addEventListener('click', function(e) {
                if (e.target.matches('#social-links #prev-made #social a#trash img')) {
                    e.preventDefault();
                    e.target.closest('#social').remove();
                } else if (e.target.matches('#social-links #prev-made #social a#move-up img')) {
                    e.preventDefault();
                    const parent = e.target.closest('#social');
                    parent.parentElement.insertBefore(parent, parent.previousElementSibling);
                } else if (e.target.matches('#social-links #prev-made #social a#move-down img')) {
                    e.preventDefault();
                    const parent = e.target.closest('#social');
                    parent.parentElement.insertBefore(parent.nextElementSibling, parent);
                }
            });
             document.querySelector('#music #prev-made').addEventListener('click', function(e) {
                if (e.target.matches('#music #prev-made #music a#trash img')) {
                    e.preventDefault();
                    e.target.closest('#music').remove();
                } else if (e.target.matches('#music #prev-made #music a#move-up img')) {
                    e.preventDefault();
                    const parent = e.target.closest('#music'); parent.parentElement.insertBefore(parent, parent.previousElementSibling);
                } else if (e.target.matches('#music #prev-made #music a#move-down img')) {
                    e.preventDefault();
                    const parent = e.target.closest('#music'); parent.parentElement.insertBefore(parent.nextElementSibling, parent);
                }
            })

            albumDetail.addEventListener('input', function() {
                if (musicElementSelected) {
                    musicElementSelected.querySelector('#extra-info').dataset.album = albumDetail.textContent
                }
            })
            artistDetail.addEventListener('input', function() {
                if (musicElementSelected) {
                    musicElementSelected.querySelector('#extra-info').dataset.artistname = artistDetail.textContent
                }
            })
            songNameDetail.addEventListener('input', function() {
                if (musicElementSelected) {
                    musicElementSelected.querySelector('#extra-info').dataset.songname = songNameDetail.textContent
                    musicElementSelected.querySelector('a#content').textContent = songNameDetail.textContent
                }
            })

            document.querySelector('#edit-displayname #hold div').textContent = userData.display_name;
            document.querySelector('#edit-signature #hold div').textContent = userData.signature;
            document.querySelector('#edit-location #hold div').textContent = userData.location;
            document.querySelector('#edit-aboutme #hold div').textContent = userData.about_me;
            document.querySelector('#edit-pfpurl #hold div').textContent = userData.pfp_url;
            document.querySelector('#edit-style #hold div').textContent = userData.style;

            iconUrl.oninput = function() { iconUrl.textContent; document.querySelector('#result img').src = iconUrl.textContent || '/images/default.png' }
            userUrl.oninput = function() { userUrl.textContent; document.querySelector('#result a').href = userUrl.textContent }
            username.oninput = function() { username.textContent; document.querySelector('#result a').textContent = '@' + (username.textContent || 'unnamed') }

            document.getElementById('save-all').addEventListener('click', async () => {
                const parent = document.querySelector('#social-links #prev-made')
                const children = parent.querySelectorAll('#social div.row.grow')
                let musicElements = document.querySelectorAll('#music #prev-made div#music.row.grow')
                let socialLinks = []
                let newMusic = []

                children.forEach(child => {
                    const icon = child.querySelector('img').src
                    const url = child.querySelector('a').href
                    const username = child.querySelector('a').textContent.slice(1)
                    socialLinks.push({ icon_link: icon, url: url, username: username })
                })

                musicElements.forEach(musicElement => {
                    const songName = musicElement.querySelector('#extra-info').dataset.songname
                    const artistName = musicElement.querySelector('#extra-info').dataset.artistname
                    const songUrl = musicElement.querySelector('#extra-info').dataset.songurl
                    const coverArt = musicElement.querySelector('#extra-info').dataset.coverart
                    const published = musicElement.querySelector('#extra-info').dataset.published
                    const album = musicElement.querySelector('#extra-info').dataset.album
                    const genre = musicElement.querySelector('#extra-info').dataset.genre
                    const link = musicElement.querySelector('#extra-info').dataset.link
                    newMusic.push({ song_name: songName, artist_name: artistName, song_url: songUrl, cover_art: coverArt, published: Number(published), album: album, genre: genre, link: link })
                })

                const profileData = {
                    display_name: document.querySelector('#edit-displayname div').textContent,
                    signature: document.querySelector('#edit-signature div').textContent,
                    location: document.querySelector('#edit-location div').textContent,
                    about_me: document.querySelector('#edit-aboutme div').textContent,
                    pfp_url: document.querySelector('#edit-pfpurl div').textContent,
                    style: document.querySelector('#edit-style div').textContent,
                    social_links: socialLinks,
                    music: newMusic
                };
                await updateProfile(profileData);
            });
            
        </script>
      </div>
    <img id="depth" src="/images/boxes/3d.png" style="width: 610px;height: 45px;">   

    </div>
    <div id="right" align="left">
    </div>
  </div>
    <script src="/updateLocalStorage.js"></script>
    <script src="../bundle.js"></script>
    <script type="module" src="/populate.js"></script>
</body>
</html>
